[project]
name = "ci-cd-intelligence-backend"
version = "0.1.0"
description = "Seeded CI simulator, leakage-safe failure prediction, promotion gate and serving API."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
