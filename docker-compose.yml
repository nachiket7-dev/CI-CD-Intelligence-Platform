services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CI_INTEL_DATABASE_URL=sqlite:////app/data/ci_intel.db
      - CI_INTEL_CORS_ORIGINS=http://localhost:5173,http://localhost:8000,http://localhost:80,http://localhost
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data:
